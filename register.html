<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — Timmo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/legal.css">
<meta name="description" content="Créez votre compte Timmo gratuitement pour enregistrer vos biens favoris, contacter les agences ou publier vos annonces immobilières au Sénégal.">
<link rel="canonical" href="https://www.timmo.sn/register.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Timmo">
<meta property="og:locale" content="fr_SN">
<meta property="og:title" content="Créer un compte — Timmo">
<meta property="og:description" content="Créez votre compte Timmo gratuitement pour enregistrer vos biens favoris, contacter les agences ou publier vos annonces immobilières au Sénégal.">
<meta property="og:url" content="https://www.timmo.sn/register.html">
<meta property="og:image" content="https://www.timmo.sn/assets/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0D1B2A">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header id="ti-header"></header>

<div class="ti-auth-wrap">
  <div class="ti-auth-card">
    <h2 data-i18n="register_title"></h2>

    <div class="ti-role-tabs" id="reg-role-tabs">
      <button data-role="client" class="active" data-i18n="role_client"></button>
      <button data-role="agency" data-i18n="role_agency"></button>
    </div>

    <div id="register-error"></div>
    <form id="form-register" onsubmit="return tiHandleRegister(event)">
      <div class="field"><label data-i18n="full_name"></label><input type="text" id="reg-name" required></div>
      <div class="field" id="reg-agency-field" style="display:none;"><label data-i18n="agency_name"></label><input type="text" id="reg-agency-name"></div>
      <div class="field"><label data-i18n="email"></label><input type="email" id="reg-email" required></div>
      <div class="field"><label data-i18n="password"></label><input type="password" id="reg-password" required minlength="6"></div>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--ink-soft);margin:-2px 0 16px;cursor:pointer;line-height:1.45;">
        <input type="checkbox" id="reg-terms" required style="width:auto;margin-top:3px;flex-shrink:0;">
        <span id="reg-terms-label"></span>
      </label>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="register_btn"></button>
    </form>

    <p style="margin-top:18px;text-align:center;font-size:.9rem;">
      <span data-i18n="have_account"></span>
      <a href="login.html" style="color:var(--clay);font-weight:700;" data-i18n="nav_login"></a>
    </p>
  </div>
</div>

<div id="ti-footer"></div>

<script src="js/i18n.js"></script>
<script src="js/currency.js"></script>
<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  tiRenderHeader();
  tiRenderFooter();

  // Case d'acceptation des CGU (le libellé contient des liens, d'où innerHTML)
  function tiRenderTermsLabel() { document.getElementById('reg-terms-label').innerHTML = t('register_accept_terms'); }
  tiRenderTermsLabel();
  document.addEventListener('ti:langchange', tiRenderTermsLabel);

  let TI_REG_ROLE = 'client';
  document.querySelectorAll('#reg-role-tabs button').forEach(b => {
    b.addEventListener('click', () => {
      TI_REG_ROLE = b.dataset.role;
      document.querySelectorAll('#reg-role-tabs button').forEach(x => x.classList.toggle('active', x === b));
      document.getElementById('reg-agency-field').style.display = TI_REG_ROLE === 'agency' ? 'block' : 'none';
      document.getElementById('reg-agency-name').required = TI_REG_ROLE === 'agency';
    });
  });

  async function tiHandleRegister(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    tiSetBtnLoading(btn, true);
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const errBox = document.getElementById('register-error');

    await new Promise(r => setTimeout(r, 350));
    let res;
    if (TI_REG_ROLE === 'agency') {
      res = await tiRegisterAgency({ name, agencyName: document.getElementById('reg-agency-name').value, email, password, acceptTerms: true });
    } else {
      res = await tiRegisterClient({ name, email, password, acceptTerms: true });
    }
    if (!res.ok) {
      tiSetBtnLoading(btn, false);
      errBox.innerHTML = `<div class="ti-error">Un compte existe déjà avec cet email. / An account already exists with this email.</div>`;
      return false;
    }
    window.location.href = `dashboard-${TI_REG_ROLE}.html`;
    return false;
  }
</script>
</body>
</html>

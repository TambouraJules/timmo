<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Détail du bien — Timmo</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<meta name="description" content="Photos, prix, disponibilités et visite 3D ou vidéo quand l&#x27;agence la propose, pour ce bien immobilier au Sénégal. Contactez l&#x27;agence ou réservez en ligne sur Timmo.">
<link rel="canonical" href="https://www.timmo.sn/property.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Timmo">
<meta property="og:locale" content="fr_SN">
<meta property="og:title" content="Détail du bien — Timmo">
<meta property="og:description" content="Photos, prix, disponibilités et visite 3D ou vidéo quand l&#x27;agence la propose, pour ce bien immobilier au Sénégal. Contactez l&#x27;agence ou réservez en ligne sur Timmo.">
<meta property="og:url" content="https://www.timmo.sn/property.html">
<meta property="og:image" content="https://www.timmo.sn/assets/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0D1B2A">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header id="ti-header"></header>

<section class="section-tight">
  <div class="container" id="ti-property-root">
    <p style="color:var(--ink-soft)">Chargement…</p>
  </div>
</section>

<div id="ti-footer"></div>

<!-- Booking modal -->
<div class="ti-modal-backdrop" id="modal-book">
  <div class="ti-modal">
    <button class="ti-modal-close" onclick="tiCloseModal('modal-book')">&times;</button>
    <h3 data-i18n="book_title"></h3>
    <form id="form-book" onsubmit="return tiSubmitBooking(event)">
      <div id="bk-date-fields"></div>
      <div class="field"><label data-i18n="book_name"></label><input type="text" id="bk-name" required></div>
      <div class="field-row">
        <div class="field"><label data-i18n="book_phone"></label><input type="tel" id="bk-phone" required></div>
        <div class="field"><label data-i18n="book_email"></label><input type="email" id="bk-email" required></div>
      </div>
      <div class="field"><label data-i18n="book_message"></label><textarea id="bk-message"></textarea></div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="book_submit"></button>
    </form>
  </div>
</div>

<!-- Message modal -->
<div class="ti-modal-backdrop" id="modal-message">
  <div class="ti-modal">
    <button class="ti-modal-close" onclick="tiCloseModal('modal-message')">&times;</button>
    <h3 data-i18n="agency_contact_title"></h3>
    <form onsubmit="return tiSubmitMessage(event)">
      <div class="field"><textarea id="msg-text" data-i18n-placeholder="message_placeholder" required></textarea></div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="send_message"></button>
    </form>
  </div>
</div>

<!-- Payment modal -->

<!-- Review modal -->
<div class="ti-modal-backdrop" id="modal-review">
  <div class="ti-modal ti-modal-flex" role="dialog" aria-modal="true" aria-labelledby="review-modal-title">
    <div class="ti-modal-head">
      <h3 id="review-modal-title" data-i18n="write_review"></h3>
      <button type="button" class="ti-modal-close" onclick="tiCloseModal('modal-review')" aria-label="Fermer">&times;</button>
    </div>
    <form class="ti-modal-form" onsubmit="return tiSubmitReview(event)">
      <div class="ti-modal-body">
        <div class="field">
          <label data-i18n="your_rating"></label>
          <div class="ti-star-input" id="review-star-input">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
          </div>
        </div>
        <div class="field">
          <label data-i18n="review_tags_label"></label>
          <p style="font-size:.8rem;color:var(--ink-soft);margin:0 0 10px;" data-i18n="review_tags_hint"></p>
          <div class="ti-amenity-picker" id="review-tags-picker"></div>
        </div>
        <div class="field" style="margin-bottom:0;"><label data-i18n="your_comment_optional"></label><textarea id="review-comment"></textarea></div>
      </div>
      <div class="ti-modal-foot">
        <button type="submit" class="btn btn-primary btn-block" data-i18n="submit_review"></button>
      </div>
    </form>
  </div>
</div>

<!-- Visite 3D / vidéo (iframe chargée seulement à l'ouverture) -->
<div class="ti-modal-backdrop" id="modal-tour" onclick="if(event.target===this) tiCloseTour()">
  <div class="ti-modal ti-modal-flex ti-modal-tour" role="dialog" aria-modal="true" aria-labelledby="tour-modal-title">
    <div class="ti-modal-head">
      <h3 id="tour-modal-title" data-i18n="tour_modal_title"></h3>
      <button type="button" class="ti-modal-close" onclick="tiCloseTour()" aria-label="Fermer">&times;</button>
    </div>
    <div class="ti-tour-frame-wrap">
      <iframe id="tour-frame" src="about:blank" title="Visite du bien" loading="lazy"
        allow="autoplay; fullscreen; xr-spatial-tracking; gyroscope; accelerometer; picture-in-picture"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="ti-modal-backdrop" id="modal-lightbox" onclick="if(event.target===this) tiCloseModal('modal-lightbox')">
  <button class="ti-lightbox-nav ti-lightbox-prev" onclick="event.stopPropagation();tiLightboxStep(-1)" aria-label="Précédent">&#8249;</button>
  <div class="ti-lightbox-stage">
    <img id="lightbox-img" src="" alt="">
    <div class="ti-lightbox-counter" id="lightbox-counter"></div>
  </div>
  <button class="ti-lightbox-nav ti-lightbox-next" onclick="event.stopPropagation();tiLightboxStep(1)" aria-label="Suivant">&#8250;</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/i18n.js"></script>
<script src="js/currency.js"></script>
<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/property.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hors connexion — Timmo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D1B2A">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F3EE; color: #0D1B2A;
         font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 360px; }
  img { height: 46px; margin-bottom: 28px; }
  h1 { font-size: 1.4rem; margin: 0 0 10px; }
  p { color: #5d6773; line-height: 1.5; margin: 0 0 22px; }
  button { font: 700 1rem inherit; background: #BF6A3D; color: #fff; border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/brand/timmo-logo-primary.svg" alt="Timmo">
    <h1>Pas de connexion internet</h1>
    <p>Vérifiez votre connexion (données mobiles ou Wi-Fi), puis réessayez. Les annonces s'afficheront dès que vous serez de nouveau en ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>

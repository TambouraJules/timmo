<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Timmo — Nouveau mot de passe</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1B2A">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header id="ti-header"></header>

<div class="ti-auth-wrap">
  <!-- Formulaire : sert aux deux cas (lien reçu par e-mail, ou mot de passe temporaire à remplacer) -->
  <div class="ti-auth-card" id="reset-form-card">
    <h2 data-i18n="reset_password_title"></h2>
    <p style="color:var(--ink-soft);" id="reset-sub" data-i18n="reset_password_sub"></p>

    <div id="reset-error"></div>
    <form id="form-reset" onsubmit="return tiHandleResetPassword(event)">
      <div class="field"><label data-i18n="new_password"></label><input type="password" id="reset-password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label data-i18n="confirm_password"></label><input type="password" id="reset-password-confirm" autocomplete="new-password" minlength="8" required></div>
      <p style="font-size:.8rem;color:var(--ink-soft);margin:-4px 0 16px;" data-i18n="password_min_length_hint"></p>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="reset_password_submit"></button>
    </form>
  </div>

  <!-- Vérification du lien en cours -->
  <div class="ti-auth-card" id="reset-checking-card" style="display:none;text-align:center;">
    <p style="color:var(--ink-soft);" data-i18n="reset_link_checking"></p>
  </div>

  <!-- Lien expiré, déjà utilisé ou invalide -->
  <div class="ti-auth-card" id="reset-invalid-card" style="display:none;text-align:center;">
    <span style="font-size:2.4rem;">⏳</span>
    <h2 data-i18n="reset_link_invalid_title"></h2>
    <p style="color:var(--ink-soft);" data-i18n="reset_link_invalid_sub"></p>
    <a href="forgot-password.html" class="btn btn-primary btn-block" style="margin-top:14px;" data-i18n="reset_link_new_request"></a>
    <a href="login.html" class="btn btn-outline btn-block" style="margin-top:10px;" data-i18n="back_to_login"></a>
  </div>

  <!-- Succès (lien e-mail) -->
  <div class="ti-auth-card" id="reset-done-card" style="display:none;text-align:center;">
    <span style="font-size:2.4rem;">✅</span>
    <h2 data-i18n="reset_link_done_title"></h2>
    <p style="color:var(--ink-soft);" data-i18n="reset_link_done_sub"></p>
    <a href="login.html?reset=1" class="btn btn-primary btn-block" style="margin-top:14px;" data-i18n="go_to_login"></a>
  </div>
</div>

<div id="ti-footer"></div>

<script src="js/i18n.js"></script>
<script src="js/currency.js"></script>
<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  tiRenderHeader();
  tiRenderFooter();

  // Deux façons d'arriver ici :
  //  1. ?token=…  → lien « mot de passe oublié » reçu par e-mail (pas besoin d'être connecté) ;
  //  2. sans jeton → connexion avec un mot de passe temporaire donné par l'admin ou le
  //     superviseur : une session active est alors nécessaire.
  const TI_RESET_TOKEN = new URLSearchParams(window.location.search).get('token');
  const tiShowResetCard = id => ['reset-form-card', 'reset-checking-card', 'reset-invalid-card', 'reset-done-card']
    .forEach(c => { document.getElementById(c).style.display = c === id ? '' : 'none'; });

  if (TI_RESET_TOKEN) {
    const sub = document.getElementById('reset-sub');
    sub.setAttribute('data-i18n', 'reset_link_sub');
    sub.textContent = t('reset_link_sub');
    tiShowResetCard('reset-checking-card');
    tiVerifyResetToken(TI_RESET_TOKEN).then(valid => {
      tiShowResetCard(valid ? 'reset-form-card' : 'reset-invalid-card');
      if (valid) document.getElementById('reset-password').focus();
    });
  } else if (!tiGetSession()) {
    window.location.href = "login.html";
  }

  async function tiHandleResetPassword(e) {
    e.preventDefault();
    const errBox = document.getElementById('reset-error');
    errBox.innerHTML = '';
    const pwd = document.getElementById('reset-password').value;
    const confirm = document.getElementById('reset-password-confirm').value;
    if (pwd !== confirm) {
      errBox.innerHTML = `<div class="ti-error">${t('passwords_dont_match')}</div>`;
      return false;
    }
    const btn = e.target.querySelector('button[type=submit]');
    tiSetBtnLoading(btn, true);

    if (TI_RESET_TOKEN) {
      const result = await tiResetPasswordWithToken(TI_RESET_TOKEN, pwd);
      tiSetBtnLoading(btn, false);
      if (!result.ok) {
        if (result.error === 'invalid_or_expired') { tiShowResetCard('reset-invalid-card'); return false; }
        errBox.innerHTML = `<div class="ti-error">${t('reset_password_failed')}</div>`;
        return false;
      }
      // Une éventuelle ancienne session sur cet appareil est fermée : on se reconnecte proprement.
      try {
        localStorage.removeItem('ti_api_token');
        localStorage.removeItem('ti_session');
        if (result.email) sessionStorage.setItem('ti_reset_email', result.email);
      } catch (err) { /* stockage indisponible */ }
      tiRenderHeader();
      tiShowResetCard('reset-done-card');
      return false;
    }

    const result = await tiChangePassword(pwd);
    if (!result.ok) {
      tiSetBtnLoading(btn, false);
      errBox.innerHTML = `<div class="ti-error">${result.error === 'same_password' ? t('cp_same') : t('reset_password_failed')}</div>`;
      return false;
    }
    tiToast(t('reset_password_success') + " ✓");
    const next = new URLSearchParams(window.location.search).get('next');
    const session = tiGetSession();
    window.location.href = next || `dashboard-${session.role}.html`;
    return false;
  }
</script>
</body>
</html>

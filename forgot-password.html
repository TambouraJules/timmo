<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timmo — Mot de passe oublié</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="ti-header"></header>

<div class="ti-auth-wrap">
  <div class="ti-auth-card" id="forgot-form-card">
    <h2 data-i18n="forgot_password_title"></h2>
    <p style="color:var(--ink-soft);" data-i18n="forgot_password_sub"></p>

    <form id="form-forgot" onsubmit="return tiHandleForgotPassword(event)">
      <div class="field"><label data-i18n="email"></label><input type="email" id="forgot-email" required></div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="forgot_password_submit"></button>
    </form>

    <p style="margin-top:18px;text-align:center;font-size:.9rem;">
      <a href="login.html" style="color:var(--clay);font-weight:700;" data-i18n="back_to_login"></a>
    </p>
  </div>

  <div class="ti-auth-card" id="forgot-success-card" style="display:none;text-align:center;">
    <span style="font-size:2.4rem;">✉️</span>
    <h2 data-i18n="forgot_password_sent_title"></h2>
    <p style="color:var(--ink-soft);" id="forgot-sent-sub"></p>
    <a href="login.html" class="btn btn-outline btn-block" style="margin-top:14px;" data-i18n="back_to_login"></a>
  </div>
</div>

<div id="ti-footer"></div>

<script src="js/i18n.js"></script>
<script src="js/currency.js"></script>
<script src="js/data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="https://unpkg.com/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  tiRenderHeader();
  tiRenderFooter();

  async function tiHandleForgotPassword(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    tiSetBtnLoading(btn, true);
    const email = document.getElementById('forgot-email').value;
    await tiRequestPasswordReset(email);
    document.getElementById('forgot-form-card').style.display = 'none';
    document.getElementById('forgot-success-card').style.display = '';
    document.getElementById('forgot-sent-sub').textContent = t('forgot_password_sent_sub').replace('{email}', email);
    return false;
  }
</script>
</body>
</html>
